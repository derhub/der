# Optional Phase 2 Web operator UI overlay for der.
# Combine with the base deployment:
#   docker compose -f docker-compose.yml -f docker-compose.web.yml up --build

services:
  server:
    environment:
      DER_ALLOWED_ORIGINS: ${DER_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8081,http://localhost:8081}

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: der-web
    image: der-web:phase2
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DER_WEB_PORT:-8081}:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - der-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
